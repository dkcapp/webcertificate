; ตั้งค่าความปลอดภัยของ PHP (โหลดผ่าน Dockerfile)

; ปิดการติดตามความคืบหน้าอัปโหลดผ่าน session (เว็บไม่ได้ใช้)
; เป็นวิธีป้องกันที่ PHP แนะนำสำหรับ CVE-2026-115560 และลดพื้นที่โจมตีแบบ PHP2Shell
session.upload_progress.enabled = 0

; ไม่บอกเวอร์ชัน PHP ใน header X-Powered-By
expose_php = Off

; ไม่แสดง error ให้ผู้ใช้เห็น แต่ยังเขียนลง log ของ Render
display_errors = Off
log_errors = On
