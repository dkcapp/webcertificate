<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ขอบคุณที่สมัครอบรม — ศูนย์อบรมคอมพิวเตอร์ วัดพระธรรมกาย</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f8ff;
        --card: #ffffff;
        --text: #1e293b;
        --text2: #475569;
        --border: #e2eaf4;
        --blue: #2563eb;
        --green: #10b981;
        --red: #ef4444;
        --amber: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: "Prompt", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 8px 24px rgba(30, 58, 95, 0.08);
      }
      .logo { width: 56px; height: 56px; object-fit: contain; margin-bottom: 8px; }
      .org { font-size: 13px; color: var(--text2); margin-bottom: 18px; }
      .icon {
        width: 64px; height: 64px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 14px; font-size: 32px; color: #fff; background: var(--green);
      }
      h1 { font-size: 2.4rem; line-height: 1.2; margin: 0 0 4px; font-weight: 600; }
      .who { font-size: 1.2rem; font-weight: 500; margin: 0 0 10px; word-break: break-word; }
      p { margin: 6px 0; color: var(--text2); font-size: 14px; line-height: 1.6; }
      .course { font-weight: 500; color: var(--text); }
      hr { border: 0; border-top: 1px solid var(--border); margin: 22px 0; }
      .qr-title { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
      .qr-box {
        width: 180px; height: 180px; margin: 0 auto;
        background: #d1d5db; border-radius: 12px; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        color: #6b7280; font-size: 13px; line-height: 1.5;
      }
      .qr-box img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
      .box { margin-top: 4px; padding: 16px; border-radius: 12px; background: #f8fafc; border: 1px solid var(--border); text-align: center; }
      .box h2 { font-size: 1rem; margin: 0 0 6px; font-weight: 600; }
      .box.ok { background: #ecfdf5; border-color: #a7f3d0; }
      .box.err { background: #fef2f2; border-color: #fecaca; }
      .box.warn { background: #fffbeb; border-color: #fde68a; }
      .info { margin-top: 10px; text-align: left; font-size: 14px; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
      .info div { margin: 3px 0; word-break: break-word; }
      .info b { font-weight: 500; color: var(--text2); }
      .actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
      .btn {
        display: inline-block; padding: 10px 26px; border-radius: 10px;
        background: var(--blue); color: #fff; border: 1px solid var(--blue);
        text-decoration: none; font-size: 14px; font-family: inherit; cursor: pointer;
      }
      .btn.ghost { background: #fff; color: var(--text2); border-color: #cbd5e1; }
      .ref { margin-top: 18px; font-size: 11px; color: #94a3b8; word-break: break-all; }

      /* ===== ใบสรุปข้อมูลการสมัคร ===== */
      body.has-summary .card { max-width: 600px; }
      .sum-note { font-size: 13px; margin: 0 0 12px; }
      .sheet {
        text-align: left; background: #fff; border: 1px solid var(--border);
        border-radius: 12px; padding: 18px 18px 14px; font-size: 13.5px; color: var(--text);
      }
      .sheet-head { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--blue); }
      .sheet-head img { width: 44px; height: 44px; object-fit: contain; }
      .sheet-org { font-size: 12px; color: var(--text2); }
      .sheet-title { font-size: 16px; font-weight: 600; color: #1e3a5f; }
      .sheet-course { margin: 12px 0 4px; padding: 10px 12px; background: #eff6ff; border-radius: 8px; }
      .sheet-course small { display: block; color: var(--text2); font-size: 11.5px; }
      .sheet-course b { font-weight: 600; word-break: break-word; }
      .sheet-sec { margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--blue); letter-spacing: .02em; }
      .sheet-dl { display: grid; grid-template-columns: 170px 1fr; border-top: 1px solid var(--border); }
      .sheet-dl > div { padding: 6px 4px; border-bottom: 1px solid var(--border); word-break: break-word; }
      .sheet-dl .k { color: var(--text2); }
      .sheet-foot { margin-top: 14px; font-size: 11.5px; color: #94a3b8; line-height: 1.6; }
      /* สำเนาที่ใช้สร้าง PDF: กว้างคงที่ ซ่อนนอกจอ */
      .sheet.export { position: fixed; left: -10000px; top: 0; width: 760px; border: 0; border-radius: 0; padding: 28px 32px; font-size: 15px; }
      .sheet.export .sheet-dl { grid-template-columns: 220px 1fr; }
      @media (max-width: 480px) {
        .sheet { padding: 14px 12px 10px; }
        .sheet-dl { grid-template-columns: 1fr; }
        .sheet-dl .k { border-bottom: 0; padding-bottom: 0; font-size: 12px; }
        .sheet-dl .v { padding-top: 2px; }
      }
      @media print {
        body { background: #fff; padding: 0; display: block; }
        body * { visibility: hidden; }
        #sheet, #sheet * { visibility: visible; }
        #sheet { position: absolute; left: 0; top: 0; width: 100%; border: 0; padding: 0; }
        .sheet-dl { grid-template-columns: 200px 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="assets/images/logo.png" alt="CTC" />
      <div class="org">ศูนย์อบรมคอมพิวเตอร์ วัดพระธรรมกาย</div>
      <div class="icon">✓</div>
      <h1>ขอบคุณ</h1>
      <div class="who" id="who"></div>
      <p id="msg">เราได้รับข้อมูลการสมัครของท่านเรียบร้อยแล้ว</p>

      <hr />
      <div class="qr-title">สแกน QR Code เพื่อเข้ากลุ่มไลน์</div>
      <div class="qr-box" id="qrBox"><span>QR Code<br />กลุ่มไลน์</span></div>

      <section id="summary" hidden>
        <hr />
        <div class="qr-title">ใบสรุปข้อมูลการสมัคร</div>
        <p class="sum-note">ตรวจสอบข้อมูลที่ท่านกรอก และดาวน์โหลดเก็บไว้เป็นหลักฐาน</p>
        <div class="sheet" id="sheet"></div>
        <div class="actions">
          <button type="button" class="btn" id="pdfBtn">ดาวน์โหลด PDF</button>
          <button type="button" class="btn ghost" id="printBtn">พิมพ์</button>
        </div>
      </section>

      <div id="approval" hidden>
        <hr />
        <div class="box" id="apBox"></div>
      </div>
      <div class="ref" id="ref"></div>
    </main>

    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var ref = q.get("ref") || "";
        var err = q.get("e") || "";
        var clean = function (v, n) { return (v || "").replace(/\s+/g, " ").trim().slice(0, n); };
        var who = clean(q.get("name"), 100);
        var course = clean(q.get("course"), 200);
        var mtype = clean(q.get("type"), 100);

        var ERR_TEXT = {
          missing: "ข้อมูลที่ส่งมาไม่ครบ กรุณากรอกแบบฟอร์มสมัครใหม่อีกครั้ง",
          cas: "ระบบอนุมัติไม่รับคำขอ อาจหาหัวหน้ากองของท่านไม่พบ กรุณาติดต่อเจ้าหน้าที่",
          upstream: "ระบบอนุมัติไม่ตอบสนองในขณะนี้ กรุณาลองใหม่อีกครั้ง",
          dup: "รหัสอ้างอิงนี้ถูกใช้งานแล้ว กรุณากรอกแบบฟอร์มสมัครใหม่อีกครั้ง",
          login: "ล็อกอินบัญชี DKC ไม่สำเร็จ หรือท่านไม่อนุญาตการเข้าถึง กรุณาลองใหม่อีกครั้ง",
          db: "ส่งคำขอถึงหัวหน้ากองแล้ว แต่บันทึกในระบบไม่สำเร็จ กรุณาติดต่อเจ้าหน้าที่พร้อมแจ้งรหัสอ้างอิง",
        };

        function $(id) { return document.getElementById(id); }
        function el(tag, cls, text) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text !== undefined) e.textContent = text;
          return e;
        }
        function link(href, text, cls) {
          var a = el("a", "btn" + (cls ? " " + cls : ""), text);
          a.href = href;
          return a;
        }
        function box(kind, title, msg) {
          $("approval").hidden = false;
          var b = $("apBox");
          b.className = "box" + (kind ? " " + kind : "");
          b.textContent = "";
          b.appendChild(el("h2", "", title));
          if (msg) b.appendChild(el("p", "", msg));
          return b;
        }

        // ทักทาย + หลักสูตร (textContent เท่านั้น)
        if (who) $("who").textContent = "คุณ" + who;
        if (course) {
          var m = $("msg");
          m.textContent = "เราได้รับข้อมูลการสมัครอบรมหลักสูตร ";
          m.appendChild(el("span", "course", "“" + course + "”"));
          m.appendChild(document.createTextNode(" ของท่านเรียบร้อยแล้ว"));
        }
        if (ref) $("ref").textContent = "รหัสอ้างอิง: " + ref;

        // รูป QR: ถ้ามีไฟล์ assets/images/line-qr.png จะแสดงแทนกรอบสีเทา
        var img = new Image();
        img.alt = "QR Code กลุ่มไลน์";
        img.onload = function () { $("qrBox").textContent = ""; $("qrBox").appendChild(img); };
        img.src = "assets/images/line-qr.png";

        // ===== ใบสรุปข้อมูลการสมัคร =====
        // thankyou.php (JotForm "Send Post Data") เก็บข้อมูลไว้ใน sessionStorage ของแท็บนี้ — ไม่มีบนเซิร์ฟเวอร์
        var summary = null;
        try { summary = JSON.parse(sessionStorage.getItem("jf_summary") || "null"); } catch (e) {}
        // ไม่แสดงถ้าเป็นใบของผู้สมัครคนอื่นที่ค้างอยู่ในแท็บเดียวกัน
        if (summary && who && summary.name && summary.name !== who) summary = null;

        function buildSheet(s) {
          var sheet = el("div", "sheet");
          var head = el("div", "sheet-head");
          var logo = new Image();
          logo.src = "assets/images/logo.png";
          logo.alt = "";
          head.appendChild(logo);
          var ht = el("div");
          ht.appendChild(el("div", "sheet-org", "ศูนย์อบรมคอมพิวเตอร์ วัดพระธรรมกาย"));
          ht.appendChild(el("div", "sheet-title", "ใบสรุปข้อมูลการสมัครอบรม"));
          head.appendChild(ht);
          sheet.appendChild(head);

          if (s.course) {
            var c = el("div", "sheet-course");
            c.appendChild(el("small", "", "หลักสูตรที่สมัคร"));
            c.appendChild(el("b", "", s.course));
            sheet.appendChild(c);
          }

          var section = "", dl = null;
          (s.rows || []).forEach(function (r) {
            if (r.label === "โปรแกรมที่ต้องการสมัครเรียน") return; // แสดงด้านบนแล้ว
            if (r.section !== section || !dl) {
              section = r.section;
              sheet.appendChild(el("div", "sheet-sec", section));
              dl = el("div", "sheet-dl");
              sheet.appendChild(dl);
            }
            dl.appendChild(el("div", "k", r.label));
            dl.appendChild(el("div", "v", r.value));
          });

          var foot = el("div", "sheet-foot");
          if (s.submission) foot.appendChild(el("div", "", "เลขที่การสมัคร: " + s.submission));
          if (s.submitted_at) foot.appendChild(el("div", "", "ส่งแบบฟอร์มเมื่อ: " + s.submitted_at + " น."));
          foot.appendChild(el("div", "", "เอกสารนี้สร้างจากข้อมูลที่ท่านกรอกในแบบฟอร์มสมัครอบรม"));
          sheet.appendChild(foot);
          return sheet;
        }

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = src;
            s.onload = resolve;
            s.onerror = function () { reject(new Error("load " + src)); };
            document.head.appendChild(s);
          });
        }

        function downloadPdf() {
          var btn = $("pdfBtn");
          var label = btn.textContent;
          btn.disabled = true;
          btn.textContent = "กำลังสร้าง PDF…";
          var clone = buildSheet(summary);
          clone.className += " export";
          document.body.appendChild(clone);
          var libs = Promise.all([
            window.html2canvas ? 0 : loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
            window.jspdf ? 0 : loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"),
          ]);
          var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
          Promise.all([libs, ready])
            .then(function () { return html2canvas(clone, { scale: 2, backgroundColor: "#ffffff", useCORS: true }); })
            .then(function (canvas) {
              // วางภาพกว้าง 190 มม. บน A4 ถ้ายาวเกินหน้าจะแบ่งเป็นหลายหน้า
              var pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
              var m = 10, w = 210 - m * 2, pageH = 297 - m * 2;
              var h = canvas.height * w / canvas.width;
              var data = canvas.toDataURL("image/jpeg", 0.92);
              for (var y = 0; y < h; y += pageH) {
                if (y > 0) pdf.addPage();
                pdf.addImage(data, "JPEG", m, m - y, w, h);
              }
              var safe = (summary.name || "ผู้สมัคร").replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "_");
              pdf.save("ใบสมัครอบรม_" + safe + ".pdf");
            })
            .catch(function () { alert("สร้าง PDF ไม่สำเร็จ กรุณาลองใหม่ หรือใช้ปุ่ม \"พิมพ์\" แล้วเลือกบันทึกเป็น PDF"); })
            .then(function () {
              clone.remove();
              btn.disabled = false;
              btn.textContent = label;
            });
        }

        if (summary && summary.rows && summary.rows.length) {
          var sheet = buildSheet(summary);
          sheet.id = "sheet";
          $("sheet").replaceWith(sheet);
          $("summary").hidden = false;
          document.body.classList.add("has-summary");
          $("pdfBtn").onclick = downloadPdf;
          $("printBtn").onclick = function () { window.print(); };
        }

        var needsApproval = !!(mtype && mtype.indexOf("ผู้นำบุญ") !== 0 && who && course);
        var startUrl = "backend/approval_start.php?" + new URLSearchParams({ name: who, course: course, type: mtype }).toString();

        function promptView() {
          var b = box("", "ต้องการส่งคำขออนุมัติถึงหัวหน้ากองเลยไหม?",
            "ระบบจะให้ล็อกอินด้วยบัญชี DKC แล้วส่งคำขอถึงหัวหน้ากองของท่านโดยอัตโนมัติ");
          var a = el("div", "actions");
          var ok = el("button", "btn", "ตกลง");
          ok.type = "button";
          ok.onclick = function () { location.href = startUrl; };
          var no = el("button", "btn ghost", "ยกเลิก");
          no.type = "button";
          no.onclick = declinedView;
          a.appendChild(ok); a.appendChild(no);
          b.appendChild(a);
        }
        function declinedView() {
          var b = box("warn", "ยังไม่ได้ส่งคำขออนุมัติ", "ท่านสามารถกลับมาส่งคำขอถึงหัวหน้ากองได้ภายหลัง");
          var a = el("div", "actions");
          var later = el("button", "btn", "ส่งคำขอภายหลัง");
          later.type = "button";
          later.onclick = promptView;
          a.appendChild(later);
          b.appendChild(a);
        }
        function errorView() {
          var b = box("err", "ส่งคำขออนุมัติไม่สำเร็จ", ERR_TEXT[err] || "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
          if (err === "cas" || err === "upstream" || err === "login") {
            var a = el("div", "actions");
            a.appendChild(link("backend/approval_submit.php", "ลองส่งใหม่"));
            b.appendChild(a);
          }
        }
        function row(parent, label, value) {
          if (!value) return;
          var d = el("div");
          d.appendChild(el("b", "", label + ": "));
          d.appendChild(document.createTextNode(value));
          parent.appendChild(d);
        }
        function resultView(d) {
          var kind = d.status === "approved" ? "ok" : d.status === "rejected" ? "err" : "ok";
          var title = d.status === "approved" ? "หัวหน้ากองอนุมัติแล้ว"
            : d.status === "rejected" ? "หัวหน้ากองไม่อนุมัติ"
            : "ส่งคำขออนุมัติถึงหัวหน้ากองแล้ว";
          var msg = d.status === "approved" ? "คำขออนุมัติของท่านได้รับการอนุมัติเรียบร้อย"
            : d.status === "rejected" ? "กรุณาติดต่อเจ้าหน้าที่หากต้องการสอบถามเพิ่มเติม"
            : "ระบบได้ส่งคำขอของท่านไปยังหัวหน้ากองเรียบร้อย กรุณารอการพิจารณา";
          var b = box(kind, title, msg);
          var info = el("div", "info");
          row(info, "หัวหน้ากอง", d.approver_name || "");
          row(info, "อีเมล", d.approver_email || "");
          row(info, "ตำแหน่ง", d.approver_position || "");
          row(info, "สังกัด", d.approver_org || "");
          if (info.childNodes.length) b.appendChild(info);
        }
        function checkFailView() {
          box("warn", "ยังตรวจสอบผลไม่ได้", "กรุณารีเฟรชหน้านี้อีกครั้งในภายหลัง");
        }

        if (err) { errorView(); return; }

        if (ref) {
          if (!/^JF-\d{10,14}-[a-f0-9]{8}$/.test(ref)) { errorView(); return; }
          fetch("backend/approval_result.php?ref=" + encodeURIComponent(ref))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (!d || !d.ok) { checkFailView(); return; }
              if (!d.found) {
                box("warn", "ไม่พบคำขออนุมัติ", "กรุณาติดต่อเจ้าหน้าที่พร้อมแจ้งรหัสอ้างอิงด้านล่าง");
                return;
              }
              resultView(d);
            })
            .catch(checkFailView);
          return;
        }

        if (needsApproval) promptView();
      })();
    </script>
  </body>
</html>
